# Mise configuration for POC monorepo root
# https://mise.jdx.dev/

[settings]
experimental = true
quiet = true

[tools]
go = "latest"
golangci-lint = "latest"
zellij = "latest"
buf = "latest"

[vars]
CONTRACTS_DIR = "{{config_root}}/contracts"
BINARY_NAME = "mmw"
BINARY_PATH = "./cmd/mmw"
BUILD_DIR = "bin"
COMPILE_OPTIONS="-tags no_clickhouse,no_mysql,no_mssql"

[env]
_.file = ".envrc"  # Load .envrc file if it exists
APP_ENV = { required = true }
APP_NAME = { required = true }
DB_PASSWORD="postgres" # TODO: make it secret
JWT_SECRET="fake-secret" # TODO: make it secret

[shell_alias]
r = "mise run"
dev = "mise run run:dev"

# Global tasks

[tasks.setup]
depends= ["stow"]
description = "Soft setup of the project"
run = """
  #!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash

  st.h1 'Fix GOPRIVATE for this project'
  st.doing go env -w "GOPRIVATE=github.com/pivaldi/mmw-*"
  st.done

  cd {{config_root}}
  st.doing 'Synchronize Go Workspace'
  st.do go work sync
  st.done
  st.doing "Go Mod Tidy"
  st.do go mod tidy
  st.done
  st.doing "Go Mod Download"
  st.do go mod download
  st.done
  """

[tasks."stow"]
description = "Sync central scripts to all service modules"
run = """
  #!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  . scripts/libs/bash-stepper/st.bash

  st.quiet

  st.h1 'Pre-Stowing'
  st.doing 'Copying gited lib to stow common package'
  st.do command cp -f -- scripts/libs/bash-stepper/st.bash stow/common/scripts/common/libs/
  st.done

  for lib in "ogl" "mmw"; do
    st.doing "Copying .golangci.yml to $lib lib"
    st.do command cp -f -- .golangci.yml "libs/$lib/"
    st.done
  done

  st.h1 'Stowing Services'
  for dir in modules/*/; do
  st.doing "Creating ${dir}scripts/"
  [ -e "${dir}scripts/" ] && st.nothing || {
  st.do mkdir -p "${dir}scripts/"
  st.done
  }

  st.doing "stowing: $dir"
  st.do stow -v --restow --dir=stow --target="$dir" common
  st.done
  done
  """

[tasks."stow:un-stow"]
description = '"materializing" or "de-stowing" the stow shared components'
run = "{{config_root}}/scripts/un-stow.sh {{config_root}}"

[tasks.tools]
description = "Install Needed Tools"
run = "{{config_root}}/stow/common/scripts/common/install-tools-ss.sh"

[tasks."tools:update"]
description = "Install and Update Needed Tools"
run = "UPDATE=true {{config_root}}/stow/common/scripts/common/install-tools-ss.sh"

[tasks.pre-commit]
depends = ["arch:check", "buf:lint"]
description = "Pre-commit checks (can be run manually or as git hook)"
run = """
  APP_ROOT_PATH={{config_root}} {{config_root}}/stow/common/scripts/common/pre-commit.sh
"""
alias = "pc"

[tasks."db:reset"]
description = "Drop the database (nuclear option)"
run = """
docker-compose -f deployments/docker-compose.yml down -v
docker-compose -f deployments/docker-compose.yml up -d postgres
"""

[tasks."db:setup"]
description = "Complete database setup (clean + migrate)"
depends = ["db:clean", "db:migrate:up"]

[tasks."db:up"]
description = "Start Docker Database"
run = "docker-compose -f deployments/docker-compose.yml up postgres -d"

[tasks."db:down"]
description = "Stop Docker Database"
run = "docker-compose -f deployments/docker-compose.yml down postgres"

[tasks."db:migrate"]
description = "Migrate Up All Services"
run = """
#!/usr/bin/env bash
set -euo pipefail

  cd {{config_root}}/modules/todo/ && mise run db:migrate:up
  cd {{config_root}}/modules/auth/ && mise run db:migrate:up
"""

[tasks."db:connect"]
description = "Connect to the database"
run = "docker exec -it todoapp-postgres psql -U postgres -d mmw"

[tasks.run]
description = "Run the application"
# depends = ["generate"] # See https://buf.build/docs/bsr/rate-limits/ for details about BSR rate limiting.
run = "go run {{vars.COMPILE_OPTIONS}} {{vars.BINARY_PATH}}/main.go"

[tasks."run:dev"]
description = "Run with hot reload (requires air)"
run = "go tool air"

[tasks.build]
description = "Build the application binary"
# depends = ["generate"]
run = """
[ -e {{vars.BUILD_DIR}} ] || mkdir -p {{vars.BUILD_DIR}}
go build {{vars.COMPILE_OPTIONS}} -o {{vars.BUILD_DIR}}/{{vars.BINARY_NAME}} -v {{vars.BINARY_PATH}}
"""

[tasks."buf:deps"]
description = "Download buf dependencies"
run = """
cd {{vars.CONTRACTS_DIR}}
buf mod update
"""

[tasks."buf:generate"]
description = "Generate the protocol buffer code"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash

  st.quiet

  st.doing 'Generating Proto'
  cd {{vars.CONTRACTS_DIR}}
  st.do find . -name 'buf.gen.*.yaml' -exec buf generate --template {} \\;
  st.done
"""

[tasks."buf:lint"]
description = "Lint protobuf files (Todo API only)"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash

  st.quiet

  cd {{vars.CONTRACTS_DIR}}
  st.doing "Linting proto file"
  st.do buf lint proto
"""

[tasks."buf:format"]
description = "Format protobuf files (Todo API only)"
run = """
  cd {{vars.CONTRACTS_DIR}}
  find ./proto/ -name '*.proto' -exec buf format -w {} \\;
"""

[tasks."buf:breaking"]
description = "Check for breaking changes in protobuf (Todo API only)"
run = """
cd {{vars.CONTRACTS_DIR}}
buf breaking --against '.git#branch=master' proto/*
"""

[tasks."todo:test"]
description = "Run all tests in todo service"
run = """
  cd modules/todo
  mise run test
"""

[tasks."todo:test:coverage"]
description = "Run tests with coverage in todo service"
run = """
  cd modules/todo
  mise run test:coverage
  """

[tasks."todo:test:integration"]
description = "Run integration tests in todo service"
run = """
  cd modules/todo
  mise run test:integration
  """

[tasks."todo:build"]
description = "Build todo service"
run = """
  cd modules/todo
  mise run build
  """

[tasks."todo:run"]
description = "Run todo service"
run = """
  cd modules/todo
  mise run run
  """

[tasks."todo:generate"]
description = "Generate code for todo service"
run = """
  cd modules/todo
  mise run generate
  """

[tasks."todo:lint"]
description = "Run linter on todo service"
run = """
  cd modules/todo
  mise run lint
  """

[tasks."ogl:test"]
description = "Run tests in ogl library"
run = """
  cd libs/ogl
  mise run test
  """

[tasks."ogl:test:coverage"]
description = "Run tests with coverage in ogl library"
run = """
  cd libs/ogl
  mise run test:coverage
  """

[tasks."mmw:test"]
description = "Run tests in mmw library"
run = """
  cd libs/mmw
  mise run test
  """

[tasks."mmw:test:coverage"]
description = "Run tests with coverage in mmw library"
run = """
  cd libs/mmw
  mise run test:coverage
  """

[tasks."test"]
depends = ["todo:test", "ogl:test", "mmw:test"]
description = "Run all tests in the monorepo"
run = "true"

[tasks.lint]
description = "Run linter on all projects"
run = """
#!/usr/bin/env bash
  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash

  st.quiet

  for dir in "libs/ogl" "libs/mmw" "contracts" "modules/todo" "modules/auth" "modules/notifications"; do
    st.h1 "Linting ${dir}…"
    cd "{{config_root}}/$dir" && golangci-lint run ./...
    echo
  done
 """

[tasks."lint:verify-config"]
description = "Verify golangci-lint configuration"
run = "golangci-lint --verbose config verify"

[tasks."arch:tree"]
description = "Show dependency tree"
run = """
  echo "Dependency tree for workspace:"
  goda tree "./..."
  """

[tasks."arch:list"]
description = "List all dependencies"
run = """
  echo "All dependencies in workspace:"
  goda list "./..."
  """

[tasks."arch:graph"]
description = "Show graph architectural dependcies for this service"
run = """
goda graph -cluster \
  "shared(github.com/pivaldi/mmw/cmd/mmw:all, github.com/pivaldi/mmw/... + github.com/pivaldi/mmw-auth/... + github.com/pivaldi/mmw-todo/... + github.com/pivaldi/mmw-notifications/... + github.com/pivaldi/mmw-contracts/...) - github.com/pivaldi/mmw-auth/cmd/migration  - github.com/pivaldi/mmw-todo/cmd/migration  - github.com/pivaldi/mmw-auth/internal/infra/persistence/migrations/... - github.com/pivaldi/mmw-todo/internal/infra/persistence/migrations/...  - github.com/pivaldi/mmw-notifications/internal/infra/persistence/migrations/... - github.com/pivaldi/mmw-arch-test/..." \
  | dot -Tsvg -o graph.svg  &&  echo 'Generated graph: {{config_root}}/graph.svg'
"""

[tasks."arch:dep-tree"]
description = "Generate visual dependency tree with dep-tree"
run = """
  echo "Generating dependency tree visualization..."
  dep-tree entrypoint ./**/*.go
  """

[tasks."arch:check"]
description = "Validate architectural boundaries across entire monorepo"
run = """
  cd {{config_root}} || exit 1
  go run {{vars.COMPILE_OPTIONS}} ./tools/arch-test
  """

[tasks."deps:circular"]
description = "Check for circular dependencies"
run = """
  echo 'TO BE FIXED, entrypoint is wrong'
  exit 1
  echo "Checking for circular dependencies..."
  dep-tree entrypoint ./modules/todo/cmd/todo/main.go --check-cycles
  """

[tasks.deps]
description = "Analyze dependencies with goda"
run = """
  echo "Analyzing workspace dependencies..."
  goda graph "./..." | dot -Tsvg -o graph.svg
  xdg-open graph.svg
"""

[tasks."deps:tree"]
description = "Show dependency tree"
run = """
echo "Dependency tree for workspace:"
goda tree "./..."
"""

[tasks."deps:list"]
description = "List all dependencies"
run = """
echo "All dependencies in workspace:"
goda list "./..."
"""

[tasks."deps:verify"]
description = "Verify Go dependencies"
run = "go mod verify"


[tasks.generate]
description = "Generate code for all projects"
run = """
  #!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash
  st.quiet

  st.h1 "Generate code for all projects"

  for dir in modules/*/; do
  st.doing "Generating code for ${dir}"
  cd "{{config_root}}/$dir" || exit 1
  mise run generate
  st.done
  done
  """

[tasks.clean]
description = "Clean all build artifacts"
run = """
  #!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash

  st.h1 "Clean all build artifacts"

  for dir in modules/*/; do
  st.doing "Cleaning ${dir}"
  cd "$dir" || exit 1
  st.do mise run clean
  st.done
  done
  """

[tasks.fmt]
description = "Format all Go code"
run = """
  echo "Formatting all Go code in workspace..."
  gofumpt -l -w .
  """

[tasks."workspace:status"]
description = "Show workspace module status"
run = """
  echo "Workspace modules:"
  go work use
  echo ""
  echo "Module verification:"
  go work sync
  go mod verify
  """

[tasks."workspace:tidy"]
description = "Tidy all modules in workspace"
run = """
#!/usr/bin/env bash
  set -euo pipefail

  cd {{config_root}}
  source scripts/libs/bash-stepper/st.bash

  st.quiet

  for dir in "libs/ogl" "libs/mmw" "contracts" "modules/todo" "modules/auth" "modules/notifications"; do
    st.h1 "Tidying ${dir}…"
    cd "{{config_root}}/$dir"
    st.do go mod tidy
    st.done
  done

  st.h1 "Syncing workspace..."
  st.do go work sync
  st.done
  """

[tasks."workspace:sync-module"]
description = "Update a workspace submodule across all dependent modules"
# Usage: mise run workspace:sync-module libs/ogl
#        mise run workspace:sync-module contracts
run = """
  #!/usr/bin/env bash
  set -euo pipefail
  cd {{config_root}} || exit 1
  source scripts/libs/bash-stepper/st.bash
  st.quiet

  SUBDIR="${1:?Usage: mise run workspace:sync-module <submodule-dir>}"
  COMMIT=$(git -C "${SUBDIR}" rev-parse HEAD)
  MODULE=$(grep '^module ' "${SUBDIR}/go.mod" | awk '{print $2}')

  st.h1 "Syncing ${MODULE} @ ${COMMIT:0:12}"

  for dir in modules/*/ contracts/ libs/ogl/; do
    [ -f "${dir}go.mod" ] || continue
    [ "${dir%/}" = "${SUBDIR}" ] && continue
    if grep -q "${MODULE}" "${dir}go.mod"; then
      st.doing "Updating ${MODULE} in ${dir}"
      st.do bash -c "cd '${dir}' && go get '${MODULE}@${COMMIT}' && go mod tidy"
      st.done
    fi
  done

  st.doing "Syncing workspace"
  st.do go work sync
  st.done
"""

[tasks."workspace:sync-modules"]
description = "Update all workspace submodules across all dependent modules"
depends = ["workspace:sync-module libs/ogl", "workspace:sync-module contracts"]
run = "true"

[tasks."module:detach"]
description = """Prepare a module to be detached from the Monolith:
- Synchronize all the modules with the latest mmw dependencies.
- Un-stow a specific module"""
depends = ["workspace:sync-module libs/ogl", "workspace:sync-module contracts", "stow:un-stow"]
run = "true"

[tasks.help]
description = "Display available tasks"
run = """
  echo "Available tasks:"
  mise tasks
  """

[tasks.doctor]
description = "Show tool versions and key environment info"
run = "{{config_root}}/stow/common/scripts/common/doctor.sh"
alias = "dr"
